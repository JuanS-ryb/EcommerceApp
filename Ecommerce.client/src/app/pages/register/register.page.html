<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-wrapper">
    <div class="auth-header">
      <ion-icon name="person-add-outline" class="auth-logo"></ion-icon>
      <h1>Crear Cuenta</h1>
      <p>Regístrate para empezar a comprar</p>
    </div>

    <div class="auth-form">
      <ion-item class="auth-input">
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-input
          label="Usuario"
          labelPlacement="floating"
          placeholder="Tu nombre de usuario"
          [(ngModel)]="user().name"
        ></ion-input>
      </ion-item>

      <ion-item class="auth-input">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-input
          label="Correo"
          labelPlacement="floating"
          type="email"
          placeholder="tucorreo@ejemplo.com"
          [(ngModel)]="user().email"
        ></ion-input>
      </ion-item>

      <ion-item class="auth-input">
        <ion-icon slot="start" name="lock-outline"></ion-icon>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          placeholder="Tu contraseña"
          [(ngModel)]="user().password"
        ></ion-input>
      </ion-item>

      <ion-button
        expand="block"
        color="primary"
        class="auth-submit"
        (click)="register()"
        [disabled]="loading()"
      >
        @if (loading()) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
        } @else {
          <ion-icon slot="start" name="person-add-outline"></ion-icon>
        }
        Registrarme
      </ion-button>

      <div class="auth-footer">
        <ion-text color="medium">¿Ya tienes cuenta?</ion-text>
        <ion-button fill="clear" color="primary" (click)="goToLogin()">
          Inicia sesión
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
